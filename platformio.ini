[platformio]
default_envs = product-c3

[env:esp32c3-base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1

[env:diagnose-c3]
extends = env:esp32c3-base
build_src_filter =
    +<diagnose/main.cpp>
    -<product/>
    -<common/>

[env:product-c3]
extends = env:esp32c3-base
build_src_filter =
    +<product/main.cpp>
    +<common/>
    -<diagnose/>
lib_deps =
    ${env:esp32c3-base.lib_deps}
    olikraus/U8g2@2.36.12

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
    +<common/ProductCore.cpp>
    +<common/ModeDevice.cpp>
    +<common/devices/*.cpp>
    -<diagnose/>
    -<product/>
